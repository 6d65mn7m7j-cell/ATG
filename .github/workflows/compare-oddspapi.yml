name: OddsPapi karşılaştırması

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "genel ya da iddaa"
        type: choice
        options: [genel, iddaa]
        default: genel

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx>=0.27"
      - name: OddsPapi'yi dene
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python scripts/compare_oddspapi.py ${{ inputs.mode == 'iddaa' && '--iddaa' || '' }}
